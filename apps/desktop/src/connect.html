<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Kru Bot</title>
    <link rel="stylesheet" href="connect.css" />
  </head>
  <body>
    <header>
      <img src="logo.png" alt="" width="28" height="28" />
      <span>Kru Bot</span>
    </header>
    <main>
      <p class="eyebrow">Connect</p>
      <h1>Where is your Kru Bot?</h1>
      <p class="description">Enter the address you open Kru Bot at in your browser.</p>
      <form id="connect" novalidate>
        <div class="field" id="field">
          <label for="server">Address</label>
          <input id="server" name="server" type="text" inputmode="url" placeholder="https://kru.example.com" autocomplete="url" autocapitalize="none" spellcheck="false" required aria-describedby="error" />
          <p class="error" id="error" role="alert" hidden></p>
        </div>
        <button type="submit" id="submit">
          <span class="spinner" aria-hidden="true" hidden></span>
          <span id="label">Connect</span>
        </button>
      </form>
    </main>
    <script src="connect.js"></script>
  </body>
</html>
